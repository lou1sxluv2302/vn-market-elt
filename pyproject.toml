[project]
name = "vnmarket"
version = "0.0.0"
description = "Intraday Vietnamese stock-market data on a cloud warehouse (ELT)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Sponsor-only vnstock libraries are NOT on PyPI and are never required in CI;
# the collector isolates them behind an interface (spec §14.7).
dev = ["ruff==0.17.0", "pre-commit==4.6.2", "pip-audit==2.10.1"]
# Extract-load (P1 history, later daily pulls); CI tests it against a local DuckDB destination.
el = ["dlt[bigquery,duckdb]==1.30.0", "requests==2.34.2"]
# Transformations (P2 on); dbt-duckdb runs the unit tests in CI without a warehouse.
dbt = ["dbt-core==1.12.5", "dbt-bigquery==1.12.1", "dbt-duckdb==1.11.0"]
# Stream collector (S1). The licensed feed library is installed separately on the machine
# that holds the licence; tzdata gives Windows the IANA time zones.
collector = [
    "pyarrow==26.0.0",
    "google-cloud-storage==3.1.1",
    "google-cloud-bigquery==3.46.1",
    "google-cloud-monitoring==2.32.0",
    "google-crc32c==1.9.0",
    "tzdata==2026.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# SQL text is assembled from code constants and committed config (table, column
# and source names); values that come from data (symbol lists) are bound as
# query parameters. Nothing a user or a data row supplies is interpolated.
"src/vnmarket/el/load_v1_history.py" = ["S608"]
"tools/reconcile_v1.py" = ["S608"]
"tools/reconcile_v1_marts.py" = ["S608"]
