# Copy to config/env/prod.yml (git-ignored) and fill in. Values here are placeholders only.
gcp:
  project_id: "<your-gcp-project-id>"
  region: us-central1
  bq_location: US
  raw_bucket: "<project-id>-prod-raw"
  tfstate_bucket: "<project-id>-tfstate"
alerts:
  email_to: "<your-alert-address>"
v1:
  # read-only source for P1 history; local path to v1 data/bronze and its DuckDB file
  bronze_dir: "<path-to-v1>/02_system/data/bronze"
  duckdb_path: "<path-to-v1>/02_system/data/vts.duckdb"
el:
  loader_service_account: "sa-loader@<project-id>.iam.gserviceaccount.com"
