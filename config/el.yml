# Extract-load settings. Local paths and the project id are in config/env/prod.yml (git-ignored).

v1_history:
  pipeline_name: v1_history
  dataset: raw_vnstock
  bq_location: US

  # Daily OHLCV parquet, one folder per ingest date: source=<s>/dataset=ohlcv_daily/ingest_date=<d>/*.parquet
  # dnse_chart is left out: in v1 it is a cross-check source, never written to the chain.
  ohlcv:
    sources: [vnstock_quote, vndirect_dchart]
    dataset_dir: ohlcv_daily
    table: ohlcv_daily
    partition_by_month_of: session_date   # ~315 partitions for 26 years, under the 4,000 a load job may touch
    cluster_by: [symbol]

  # Flat reference files, overwritten daily in v1: loaded as snapshots, one per file content.
  # Not partitioned: each is under 10 MB, far below where BigQuery partitions pay off.
  reference:
    source_dir: vnstock_data
    files: [all_symbols, symbols_by_exchange, symbols_by_industries, industries_icb, company_overview]
    table_prefix: ref_

  # Daily flow history that v1 keeps as ONE file rewritten each day (a snapshot, not a log):
  # loaded like the reference lists - a new snapshot only when the file's content changes -
  # but partitioned and clustered like OHLCV, since a snapshot holds millions of rows.
  # Measured 2026-10-15: foreign_trade 3,780,207 rows (77 MB parquet), prop_trade 149,381.
  # Each changed snapshot adds a full copy to raw (~1 GB logical for foreign_trade), so
  # reload history only when needed; staging reads the newest snapshot.
  flows:
    source_dir: vnstock_data
    files: {foreign_trade: foreign_trade_daily, prop_trade: prop_trade_daily}  # file: table
    partition_by_month_of: session_date
    cluster_by: [symbol]

  # Fundamentals: v1's quarterly / yearly financial statements (long form, one source: VCI) and
  # its charter-capital history, each ONE file that v1's manual extractor rewrites whole: the
  # flows' snapshot rule. Clustered by symbol, not partitioned: a statement is keyed by a fiscal
  # period, not a session. Measured 2026-10-21: fundamental_statement 6,092,666 rows (27 MB
  # parquet, written 2026-08-22, 2018 to 2026 Q2), capital_history 5,819 rows. Statements carry
  # no publication date; v1's `available_from_date` is the statutory deadline + 5 days, and
  # dbt recomputes it from a seed and reconciles the two (docs/knowledge/data-sources.md).
  fundamentals:
    source_dir: vnstock_data
    files: {fundamental_statement: fundamental_statement, capital_history: capital_history}  # file: table
    cluster_by: [symbol]

  # Index history: v1 keeps it only in its DuckDB table (no parquet log), opened read-only.
  # Loaded as a snapshot whose hash covers the table sorted by its key.
  index:
    duckdb_table: bronze_index
    key: [index_code, session_date]
    table: index_daily

  # Files whose name ends in anything other than ".parquet" (v1 keeps daily *.parquet.bak_<date>
  # snapshots next to the live files) are never read.
  file_suffix: .parquet

  # The loader runs as sa-loader through impersonation (name in config/env/prod.yml).
  oauth_scope: https://www.googleapis.com/auth/cloud-platform
  impersonation_token_seconds: 3600      # life of one token; the credentials mint a new one when it expires

  # Outbound timeouts (engineering rule: every call has one).
  bigquery_http_timeout_seconds: 60
  bigquery_file_upload_timeout_seconds: 1800
  bigquery_retry_deadline_seconds: 300

# Vietcap (VCI) public REST endpoints, called directly with `requests`: no vendor library
# (PyPI quarantined vnstock and vnai on 2026-09-24; the vnstock source showed these URLs and
# headers). Loaded by vnmarket.el.load_vci_reference into raw_vnstock as sa-loader.
vci_rest:
  pipeline_name: vci_reference
  dataset: raw_vnstock
  bq_location: US
  headers:
    User-Agent: "Mozilla/5.0"
    Accept: application/json
    Referer: "https://trading.vietcap.com.vn/"
    Origin: "https://trading.vietcap.com.vn/"
  timeout_seconds: 30            # per HTTP call (engineering rule: every call has one)
  # Between calls. Measured 2026-10-21: 0.3-0.8 s per call; at 1.5 s the events endpoint
  # stopped answering after ~250 calls (read timeouts for 20 calls in a row and after), so
  # the pace is halved and a failed call waits before it is retried.
  pause_seconds: 3.0
  retry_backoff_seconds: [60, 180, 600]   # waits before the 1st, 2nd, 3rd retry of one call
  max_consecutive_errors: 5      # calls that failed after every retry; then "source down"
  # Corporate actions: dividends (DIV) and share issues (ISS: bonus, stock dividend, rights,
  # placements). The default call returns only the latest 50 events of EVERY kind, so the
  # codes are filtered and every page is read; a symbol whose rows differ from the server's
  # `totalElements` is refused (rule 9: silent truncation blocks the write).
  corporate_actions:
    url: "https://iq.vietcap.com.vn/api/iq-insight-service/v1/events"
    event_codes: "DIV,ISS"
    from_date: "20000101"
    page_size: 100
    max_pages: 20                # 2,000 events; measured maximum 95 (FPT, 2026-10-21)
    table: corporate_actions
    # The symbol list: v1's symbols_by_exchange snapshot, stocks of these exchanges, delisted
    # ones included (leaving them out would be survivorship bias).
    symbol_file: symbols_by_exchange
    exchanges: [HSX, HNX, DELISTED]
    instrument_type: STOCK
  # Index membership, today's list only (no history exists): an append-only daily ledger.
  # VNDIAMOND returned an empty response on 2026-10-21, so it is not requested.
  index_members:
    url: "https://trading.vietcap.com.vn/api/price/symbols/getByGroup"
    groups: {VN30: 30, HNX30: 30}  # group: expected member count (a different count is refused)
    table: index_membership_snapshot

reconcile_v1:
  query_timeout_seconds: 900
  # Differences v1's own process explains, with the most of each that may appear.
  # Measured 2026-10-13 by a read-only preflight on v1 (parquet standing in for raw):
  # primary 4,581,477 rows equal, 0 mismatch. A larger count means v1 changed -
  # explain it before raising a number here.
  allowed_residuals:
    held_by_fallback: 3285      # v1 kept the fallback source's row for the key
    absent_in_v1: 41            # v1 removed the key when it re-fetched a date range
    fallback_batch_not_in_log: 182   # one v1 fallback batch (2026-08-06 11:40 ICT) never reached the parquet log
  # Position weight for the per-symbol checksum: a value moved between two dates,
  # or +x on one date and -x on another, changes the weighted sum.
  checksum_modulus: 1009
  # Relative tolerance for floating-point sums in snapshot signatures: BigQuery and DuckDB
  # add doubles in different orders. Flow values reach ~1e14 VND per symbol and the weighted
  # sums ~1e17, where double precision is ~1e-16 relative; 1e-9 leaves room for ~1e7 terms.
  signature_tolerance: 1.0e-9
  marts_dataset: marts_daily   # read by tools/reconcile_v1_marts.py as sa-bi-reader
  adv_window_rows: 20          # the dbt var of the same name: rows an ADV reads
  # v1 batches that wrote rows but never reached v1's parquet log (P1, measured 2026-10-13)
  unlogged_v1_batches: ["2026-08-06T04:40:36.043644+00:00"]

# Column-name prefixes BigQuery refuses, case-insensitive (its error message and
# "Column names" in the BigQuery docs). Checked before loading, because a local
# DuckDB destination accepts them and only the cloud load would fail.
bigquery_reserved_prefixes: [_partition, _table_, _file_, _row_timestamp, __root__, _colidentifier, _dremel_, _change_]
