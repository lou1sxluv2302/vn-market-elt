# Install: see "Local setup" in CONTRIBUTING.md (pinned versions live in pyproject.toml).
repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: secret scan (all git objects)
        entry: python tools/secret_scan.py
        language: system
        pass_filenames: false
        always_run: true
      - id: no-data-files
        name: no market data outside tests/fixtures
        entry: data files are not allowed outside tests/fixtures
        language: fail
        files: \.(parquet|pbix|duckdb|csv|jsonl)$
        exclude: ^tests/fixtures/
      - id: no-typographic-dashes
        name: ASCII hyphen only (no em or en dash)
        language: pygrep
        entry: '\xe2\x80[\x93\x94]'  # UTF-8 bytes of en/em dash (pygrep compiles bytes)
        types: [text]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
