version: 2

models:
  - name: dim_trading_calendar
    description: One row per calendar day; sessions observed in history, weekdays minus holidays after.
    data_tests:
      - not_empty
      - row_condition:
          name: calendar_weekday_and_week_start
          arguments:
            condition: iso_weekday between 1 and 7 and trading_week_start <= calendar_date and (not is_trading_day or iso_weekday <= 5)
    columns:
      - name: calendar_date
        data_tests: [unique, not_null]
      - name: session_seq
        data_tests: [unique]

  - name: dim_security
    description: >
      Symbol and exchange per effective period (SCD2). Known gap: no listing or delisting
      dates (ADR-0028).
    columns:
      - name: symbol
        data_tests: [not_null]
    data_tests:
      - not_empty
      - unique_combination:
          arguments:
            columns: [symbol, effective_from]

  - name: fct_price_daily
    description: Clean daily prices with exchange, tick and band of the trade date.
    # session_seq is not null exactly when the date is a trading day:
    # tests/assert_price_dates_are_trading_days.sql checks that, once.
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol, trade_date]
      - not_empty
      # v1 dq 2-4 and 7, one condition each (data-quality-lessons §28).
      - row_condition:
          name: price_close_positive
          arguments:
            condition: close_vnd > 0
      - row_condition:
          name: price_close_within_low_high
          arguments:
            condition: close_vnd between low_vnd and high_vnd
      - row_condition:
          name: price_open_within_low_high
          arguments:
            condition: open_vnd between low_vnd and high_vnd
      - row_condition:
          name: price_volume_not_negative
          arguments:
            condition: match_qty >= 0
      - row_condition:
          # A price in thousands of VND, or scaled wrong, is rarely a multiple of 10. Primary
          # rows only: the fallback (VNDirect DCHART) has 1-VND resolution by design
          # (data-sources.md §5; 330 fallback rows on prod 2026-10-13, 0 primary rows).
          # v1 checked every universe row; it had no fallback rows there. A fallback row in
          # thousands of VND is therefore not caught here (a declared gap).
          name: price_close_multiple_of_10_vnd
          arguments:
            condition: mod(close_vnd, 10) = 0
          config:
            where: "_source_id = '{{ var(\"primary_price_source\") }}'"
    columns:
      - name: symbol
        data_tests: [not_null]
      - name: close_vnd
        data_tests: [not_null]

  - name: fct_liquidity_daily
    description: ADV20 over the previous non-stale rows and the liquidity tier.
    data_tests:
      - not_empty
      - unique_combination:
          arguments:
            columns: [symbol, trade_date]
    columns:
      - name: symbol
        data_tests: [not_null]
      - name: liquidity_tier
        data_tests:
          - accepted_values:
              arguments:
                values: [HIGH, MEDIUM, LOW, REJECT, INSUFFICIENT]

  - name: fct_universe_daily
    description: Point-in-time universe flag and the first reason a row is out.
    data_tests:
      - not_empty
      - unique_combination:
          arguments:
            columns: [symbol, trade_date]
    columns:
      - name: symbol
        data_tests: [not_null]
      - name: is_in_universe
        data_tests: [not_null]


  - name: fct_foreign_flow_daily
    description: Foreign flow per symbol and session; the match / put-through split only where valid.
    columns:
      - name: symbol
        data_tests: [not_null]
      - name: trade_date
        data_tests: [not_null]
      - name: is_breakdown_valid
        description: >
          True when match + put-through = total on every side and unit (and, for foreign
          flow, from 2020-01-02); false otherwise, also when an input is NULL. Use this one.
        data_tests: [not_null]
      - name: is_source_breakdown_valid
        description: v1's own flag, kept for audit; it passed rows this model rejects (flows.md §2.3).
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol, trade_date]
      - not_empty
      - breakdown_identity_holds:
          arguments:
            prefix: foreign
      - split_null_when_invalid:
          arguments:
            prefix: foreign
      - row_condition:
          # flows.md §2.3: foreign splits are reliable only from 2020.
          name: foreign_split_not_valid_before_cutoff
          arguments:
            condition: "not is_breakdown_valid or trade_date >= cast('{{ var(\"foreign_breakdown_valid_from\") }}' as date)"

  - name: fct_prop_flow_daily
    description: Proprietary flow per symbol and session, best-effort; split only where valid.
    columns:
      - name: symbol
        data_tests: [not_null]
      - name: trade_date
        data_tests: [not_null]
      - name: is_breakdown_valid
        description: >
          True when match + put-through = total on every side and unit (and, for foreign
          flow, from 2020-01-02); false otherwise, also when an input is NULL. Use this one.
        data_tests: [not_null]
      - name: is_source_breakdown_valid
        description: v1's own flag, kept for audit; it passed rows this model rejects (flows.md §2.3).
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol, trade_date]
      - not_empty
      - breakdown_identity_holds:
          arguments:
            prefix: prop
      - split_null_when_invalid:
          arguments:
            prefix: prop

  - name: fct_index_daily
    description: Index levels per index code and session, in points.
    columns:
      - name: index_code
        data_tests: [not_null]
      - name: trade_date
        data_tests: [not_null]
    data_tests:
      - unique_combination:
          arguments:
            columns: [index_code, trade_date]
      - not_empty

  - name: fct_price_revision
    description: >
      One row per pull that changed rows of an earlier pull of the same (source, symbol):
      a vendor history rewrite, classed same_close, rescale, noise or other (P4, Q1;
      the classes in the model's header, thresholds in dbt_project.yml).
    data_tests:
      - unique_combination:
          arguments:
            columns: [_source_id, symbol, _ingested_at, _source_file]
    columns:
      - name: revision_class
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [same_close, rescale, noise, other]

unit_tests:
  - name: calendar_observed_history_then_rule
    description: >
      Inside the observed range a day is a session only with >= 3 traded symbols (threshold
      overridden to 3); a weekday below it is not. After the range: weekdays minus seeded
      holidays (2026-11-24 a holiday, so not a session). Sessions are numbered gap-free.
    model: dim_trading_calendar
    overrides:
      vars:
        min_traded_symbols_per_session: 3
        calendar_first_date: "2026-11-19"
        calendar_last_date: "2026-11-25"
    given:
      - input: ref('int_prices__flagged')
        rows:
          - {symbol: A, trade_date: 2026-11-19, match_qty: 1}
          - {symbol: B, trade_date: 2026-11-19, match_qty: 1}
          - {symbol: C, trade_date: 2026-11-19, match_qty: 1}
          - {symbol: A, trade_date: 2026-11-20, match_qty: 1}
          - {symbol: B, trade_date: 2026-11-20, match_qty: 0}
          - {symbol: C, trade_date: 2026-11-20, match_qty: 1}
          - {symbol: A, trade_date: 2026-11-23, match_qty: 1}
          - {symbol: B, trade_date: 2026-11-23, match_qty: 1}
          - {symbol: C, trade_date: 2026-11-23, match_qty: 1}
      - input: ref('holidays')
        rows:
          - {holiday_date: 2026-11-24, status: announced, occasion: culture_day}
    expect:
      rows:
        - {calendar_date: 2026-11-19, is_trading_day: true, calendar_source: observed, session_seq: 1}
        - {calendar_date: 2026-11-20, is_trading_day: false, calendar_source: observed, session_seq: null}
        - {calendar_date: 2026-11-21, is_trading_day: false, calendar_source: observed, session_seq: null}
        - {calendar_date: 2026-11-22, is_trading_day: false, calendar_source: observed, session_seq: null}
        - {calendar_date: 2026-11-23, is_trading_day: true, calendar_source: observed, session_seq: 2}
        - {calendar_date: 2026-11-24, is_trading_day: false, calendar_source: rule, session_seq: null}
        - {calendar_date: 2026-11-25, is_trading_day: true, calendar_source: rule, session_seq: 3}

  - name: calendar_year_end_keys
    description: >
      Across a year end with a holiday: the last session of December closes the month
      and the quarter, ISO weeks stay in the old ISO year, sessions are counted per month.
    model: dim_trading_calendar
    overrides:
      vars:
        min_traded_symbols_per_session: 99
        calendar_first_date: "2026-12-30"
        calendar_last_date: "2027-01-04"
    given:
      - input: ref('int_prices__flagged')
        rows:
          - {symbol: A, trade_date: 2026-12-30, match_qty: 1}
      - input: ref('holidays')
        rows:
          - {holiday_date: 2027-01-01, status: provisional, occasion: new_year}
    expect:
      rows:
        - {calendar_date: 2026-12-30, is_trading_day: true, trading_week_id: 202653, is_month_end_session: false, is_quarter_end_session: false, month_session_count: 2}
        - {calendar_date: 2026-12-31, is_trading_day: true, trading_week_id: 202653, is_month_end_session: true, is_quarter_end_session: true, month_session_count: 2}
        - {calendar_date: 2027-01-01, is_trading_day: false, trading_week_id: 202653, is_month_end_session: false, is_quarter_end_session: false, month_session_count: 1}
        - {calendar_date: 2027-01-02, is_trading_day: false, trading_week_id: 202653, is_month_end_session: false, is_quarter_end_session: false, month_session_count: 1}
        - {calendar_date: 2027-01-03, is_trading_day: false, trading_week_id: 202653, is_month_end_session: false, is_quarter_end_session: false, month_session_count: 1}
        - {calendar_date: 2027-01-04, is_trading_day: true, trading_week_id: 202701, is_month_end_session: true, is_quarter_end_session: true, month_session_count: 1}

  - name: delisted_exchange_inferred_and_announced_move_splits
    description: >
      A listed HNX stock gets two periods split at the move date; a delisted symbol takes
      the tick-inferred exchange (all low prices multiples of 100: HNX) and keeps one period;
      a delisted symbol with too few prices to infer from has no exchange.
    model: dim_security
    overrides:
      vars:
        exchange_inference_min_rows: 2
    given:
      - input: ref('int_prices__flagged')
        rows:
          - {symbol: HNXA, close_vnd: 9000}
          - {symbol: DEAD, close_vnd: 9100}
          - {symbol: DEAD, close_vnd: 9200}
          - {symbol: HOSEA, close_vnd: 9010}
          - {symbol: THIN, close_vnd: 9300}
          - {symbol: GONE, close_vnd: 9400}
          - {symbol: GONE, close_vnd: 9500}
      - input: ref('stg_vnstock__symbols')
        rows:
          - {symbol: HNXA, exchange: HNX, is_delisted: false, instrument_type: STOCK}
          - {symbol: DEAD, exchange: null, is_delisted: true, instrument_type: STOCK}
          - {symbol: HOSEA, exchange: HOSE, is_delisted: false, instrument_type: STOCK}
          - {symbol: THIN, exchange: null, is_delisted: true, instrument_type: STOCK}
      - input: ref('exchange_changes')
        rows:
          - {from_exchange: HNX, to_exchange: HOSE, effective_from: 2026-12-28, effective_to: null, applies_to: every_listed_stock}
      - input: ref('exchange_alias')
        rows:
          - {source_value: HOSE, is_in_scope: true}
          - {source_value: HNX, is_in_scope: true}
    expect:
      rows:
        - {symbol: HNXA, exchange: HNX, effective_from: null, effective_to: 2026-12-28, exchange_is_inferred: false}
        - {symbol: HNXA, exchange: HOSE, effective_from: 2026-12-28, effective_to: null, exchange_is_inferred: false}
        - {symbol: DEAD, exchange: HNX, effective_from: null, effective_to: null, exchange_is_inferred: true}
        - {symbol: HOSEA, exchange: HOSE, effective_from: null, effective_to: null, exchange_is_inferred: false}
        - {symbol: THIN, exchange: null, effective_from: null, effective_to: null, exchange_is_inferred: false}
        - {symbol: GONE, exchange: HNX, effective_from: null, effective_to: null, exchange_is_inferred: true}

  - name: price_rows_dropped_as_v1
    description: >
      Kept: a clean row, a stale row (forced O=H=L=C). Dropped: a non-stale row with a bad
      open, a null-stale row with a bad open (three-valued, as v1), a weekend row, a row
      after the last observed session. Exchange is the one valid on the trade date.
    model: fct_price_daily
    given:
      - input: ref('int_prices__flagged')
        rows:
          - {symbol: OK, trade_date: 2026-12-24, open_vnd: 10000, high_vnd: 10200, low_vnd: 9900, close_vnd: 10100, match_qty: 5, is_stale: false, is_bad_null: false, is_bad_nonpositive: false, is_bad_ohlc: false, is_bad_known_date: false, is_open_outside_range: false}
          - {symbol: OK, trade_date: 2026-12-28, open_vnd: 10000, high_vnd: 10200, low_vnd: 9900, close_vnd: 10100, match_qty: 0, is_stale: true, is_bad_null: false, is_bad_nonpositive: false, is_bad_ohlc: false, is_bad_known_date: false, is_open_outside_range: false}
          - {symbol: BADOPEN, trade_date: 2026-12-24, open_vnd: 20000, high_vnd: 10200, low_vnd: 9900, close_vnd: 10100, match_qty: 5, is_stale: false, is_bad_null: false, is_bad_nonpositive: false, is_bad_ohlc: false, is_bad_known_date: false, is_open_outside_range: true}
          - {symbol: NULLSTALE, trade_date: 2026-12-24, open_vnd: 20000, high_vnd: 10200, low_vnd: 9900, close_vnd: 10100, match_qty: 0, is_stale: null, is_bad_null: false, is_bad_nonpositive: false, is_bad_ohlc: false, is_bad_known_date: false, is_open_outside_range: true}
          - {symbol: NULLOK, trade_date: 2026-12-24, open_vnd: 10000, high_vnd: 10200, low_vnd: 9900, close_vnd: 10100, match_qty: 0, is_stale: null, is_bad_null: false, is_bad_nonpositive: false, is_bad_ohlc: false, is_bad_known_date: false, is_open_outside_range: false}
          - {symbol: WEEKEND, trade_date: 2026-12-26, open_vnd: 10000, high_vnd: 10200, low_vnd: 9900, close_vnd: 10100, match_qty: 5, is_stale: false, is_bad_null: false, is_bad_nonpositive: false, is_bad_ohlc: false, is_bad_known_date: false, is_open_outside_range: false}
          - {symbol: LATE, trade_date: 2026-12-29, open_vnd: 10000, high_vnd: 10200, low_vnd: 9900, close_vnd: 10100, match_qty: 5, is_stale: false, is_bad_null: false, is_bad_nonpositive: false, is_bad_ohlc: false, is_bad_known_date: false, is_open_outside_range: false}
      - input: ref('dim_trading_calendar')
        rows:
          - {calendar_date: 2026-12-24, is_trading_day: true, calendar_source: observed, session_seq: 1}
          - {calendar_date: 2026-12-26, is_trading_day: false, calendar_source: observed, session_seq: null}
          - {calendar_date: 2026-12-28, is_trading_day: true, calendar_source: observed, session_seq: 2}
          - {calendar_date: 2026-12-29, is_trading_day: true, calendar_source: rule, session_seq: 3}
      - input: ref('dim_security')
        rows:
          - {symbol: OK, exchange: HNX, is_in_scope: true, effective_from: null, effective_to: 2026-12-28}
          - {symbol: OK, exchange: HOSE, is_in_scope: true, effective_from: 2026-12-28, effective_to: null}
          - {symbol: NULLOK, exchange: HOSE, is_in_scope: true, effective_from: null, effective_to: null}
      - input: ref('tick_size')
        rows:
          - {exchange: HNX, instrument_class: stock, price_from_vnd: 0, tick_vnd: 100}
          - {exchange: HOSE, instrument_class: stock, price_from_vnd: 0, tick_vnd: 10}
          - {exchange: HOSE, instrument_class: stock, price_from_vnd: 10000, tick_vnd: 50}
      - input: ref('price_band')
        rows:
          - {exchange: HNX, band_case: normal, band_ratio: 0.10}
          - {exchange: HOSE, band_case: normal, band_ratio: 0.07}
    expect:
      rows:
        - {symbol: OK, trade_date: 2026-12-24, exchange: HNX, open_vnd: 10000, low_vnd: 9900, tick_vnd: 100, price_band_ratio: 0.10, session_seq: 1}
        - {symbol: OK, trade_date: 2026-12-28, exchange: HOSE, open_vnd: 10100, low_vnd: 10100, tick_vnd: 50, price_band_ratio: 0.07, session_seq: 2}
        - {symbol: NULLOK, trade_date: 2026-12-24, exchange: HOSE, open_vnd: 10000, low_vnd: 9900, tick_vnd: 50, price_band_ratio: 0.07, session_seq: 1}

  - name: adv_uses_previous_non_stale_rows_only
    description: >
      Window of 2 previous rows (overridden), min 2: the first two rows are insufficient,
      the current row never counts; stale rows are skipped, not counted as zero.
    model: fct_liquidity_daily
    overrides:
      vars:
        adv_window_rows: 2
        adv_min_rows: 2
        liquidity_tier_high_vnd: 300
        liquidity_tier_medium_vnd: 200
        liquidity_tier_low_vnd: 100
    given:
      - input: ref('fct_price_daily')
        rows:
          - {symbol: A, trade_date: 2026-01-05, session_seq: 1, turnover_vnd: 100, is_stale: false}
          - {symbol: A, trade_date: 2026-01-06, session_seq: 2, turnover_vnd: 300, is_stale: false}
          - {symbol: A, trade_date: 2026-01-07, session_seq: 3, turnover_vnd: 0, is_stale: true}
          - {symbol: A, trade_date: 2026-01-08, session_seq: 4, turnover_vnd: 9999, is_stale: false}
          - {symbol: A, trade_date: 2026-01-09, session_seq: 5, turnover_vnd: 50, is_stale: false}
    expect:
      rows:
        - {symbol: A, trade_date: 2026-01-05, adv_rows: 0, adv_20d_vnd: null, liquidity_tier: INSUFFICIENT}
        - {symbol: A, trade_date: 2026-01-06, adv_rows: 1, adv_20d_vnd: 100, liquidity_tier: INSUFFICIENT}
        - {symbol: A, trade_date: 2026-01-08, adv_rows: 2, adv_20d_vnd: 200, liquidity_tier: MEDIUM}
        - {symbol: A, trade_date: 2026-01-09, adv_rows: 2, adv_20d_vnd: 5149.5, liquidity_tier: HIGH}

  - name: universe_reasons
    description: Each planted row is out for exactly its own reason; the control row is in.
    model: fct_universe_daily
    given:
      - input: ref('fct_price_daily')
        rows:
          - {symbol: IN, trade_date: 2026-01-08, is_in_scope: true, is_stale: false}
          - {symbol: UPC, trade_date: 2026-01-08, is_in_scope: false, is_stale: false}
          - {symbol: STL, trade_date: 2026-01-08, is_in_scope: true, is_stale: true}
          - {symbol: NUL, trade_date: 2026-01-08, is_in_scope: true, is_stale: null}
          - {symbol: NEW, trade_date: 2026-01-08, is_in_scope: true, is_stale: false}
          - {symbol: THN, trade_date: 2026-01-08, is_in_scope: true, is_stale: false}
      - input: ref('fct_liquidity_daily')
        rows:
          - {symbol: IN, trade_date: 2026-01-08, liquidity_tier: LOW}
          - {symbol: UPC, trade_date: 2026-01-08, liquidity_tier: HIGH}
          - {symbol: NEW, trade_date: 2026-01-08, liquidity_tier: INSUFFICIENT}
          - {symbol: THN, trade_date: 2026-01-08, liquidity_tier: REJECT}
    expect:
      rows:
        - {symbol: IN, is_in_universe: true, exclusion_reason: null}
        - {symbol: UPC, is_in_universe: false, exclusion_reason: exchange_out_of_scope}
        - {symbol: STL, is_in_universe: false, exclusion_reason: stale}
        - {symbol: NUL, is_in_universe: false, exclusion_reason: stale}
        - {symbol: NEW, is_in_universe: false, exclusion_reason: insufficient_history}
        - {symbol: THN, is_in_universe: false, exclusion_reason: below_liquidity_floor}

  - name: flow_split_kept_only_where_valid
    description: >
      Valid from 2020 with an exact identity keeps the split (OK); a row whose match +
      put-through misses total loses it but keeps total (GAP, v1's wrong-zero pattern);
      a row before the cut-off loses it even when the identity holds (OLD).
    model: fct_foreign_flow_daily
    overrides:
      vars:
        flow_breakdown_tolerance: 0
        foreign_breakdown_valid_from: "2020-01-02"
    given:
      - input: ref('stg_vnstock__foreign_trade')
        rows:
          - {symbol: OK, trade_date: 2026-07-31, foreign_buy_match_value_vnd: 70, foreign_buy_put_through_value_vnd: 30, foreign_buy_total_value_vnd: 100, foreign_sell_match_value_vnd: 5, foreign_sell_put_through_value_vnd: 0, foreign_sell_total_value_vnd: 5, foreign_buy_match_qty: 7, foreign_buy_put_through_qty: 3, foreign_buy_total_qty: 10, foreign_sell_match_qty: 1, foreign_sell_put_through_qty: 0, foreign_sell_total_qty: 1}
          - {symbol: GAP, trade_date: 2026-07-31, foreign_buy_match_value_vnd: 0, foreign_buy_put_through_value_vnd: 0, foreign_buy_total_value_vnd: 100, foreign_sell_match_value_vnd: 5, foreign_sell_put_through_value_vnd: 0, foreign_sell_total_value_vnd: 5, foreign_buy_match_qty: 0, foreign_buy_put_through_qty: 0, foreign_buy_total_qty: 10, foreign_sell_match_qty: 1, foreign_sell_put_through_qty: 0, foreign_sell_total_qty: 1}
          - {symbol: OLD, trade_date: 2019-12-31, foreign_buy_match_value_vnd: 70, foreign_buy_put_through_value_vnd: 30, foreign_buy_total_value_vnd: 100, foreign_sell_match_value_vnd: 5, foreign_sell_put_through_value_vnd: 0, foreign_sell_total_value_vnd: 5, foreign_buy_match_qty: 7, foreign_buy_put_through_qty: 3, foreign_buy_total_qty: 10, foreign_sell_match_qty: 1, foreign_sell_put_through_qty: 0, foreign_sell_total_qty: 1}
    expect:
      rows:
        - {symbol: OK, is_breakdown_valid: true, foreign_buy_match_value_vnd: 70, foreign_buy_total_value_vnd: 100}
        - {symbol: GAP, is_breakdown_valid: false, foreign_buy_match_value_vnd: null, foreign_buy_total_value_vnd: 100}
        - {symbol: OLD, is_breakdown_valid: false, foreign_buy_match_value_vnd: null, foreign_buy_total_value_vnd: 100}

  - name: price_revision_classes
    description: >
      One known answer per class. RES: the whole history moved by 0.9, one close rounded
      to the 10-VND grid (4 VND off) - rescale. VOL: only a volume changed - same_close.
      NOI: a 0.1% move on a window - noise (a coverage test alone would call it other).
      WIN: 0.9 on a window, first row untouched - other, not rescale. TWO: two ratios at
      once - other. ZER: a close from 0 has no ratio - other. EDG (ratio 0.75, exact in binary): 20 VND off the
      reference ratio is a rescale, 21 is not (the bound is inclusive). ONE: a row left out of a 0.75
      rescale - other. RND: a row that 0.1% rounds back to itself (10 VND off) - rescale.
    model: fct_price_revision
    overrides:
      vars:
        revision_rescale_min_coverage: 0.7   # lower than prod, so ONE and RND isolate the deviation
        revision_rescale_max_deviation_vnd: 20
        revision_noise_max_move: 0.005
    given:
      - input: ref('int_prices__revisions')
