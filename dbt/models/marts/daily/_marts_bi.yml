version: 2

# BI marts (BI plan B1-B2, private plan 2026-10-18): the tables the Power BI report imports.

models:
  - name: int_prices__indicators
    description: >
      Per symbol and session: return against the previous session's close, and SMA 20 / 50 /
      200 and 52-week high / low over non-stale sessions (NULL in warm-up and on stale rows).
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol, trade_date]

  - name: fct_symbol_session_daily
    description: The symbol-level fact the report imports - prices, indicators, liquidity, universe, foreign flow.
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol, trade_date]
      - not_empty

  - name: fct_market_breadth_daily
    description: Breadth counts per exchange and session (flows.md §4); ratios are built in the report.
    data_tests:
      - unique_combination:
          arguments:
            columns: [exchange, trade_date]
      - not_empty
      - row_condition:
          name: breadth_parts_within_active
          arguments:
            condition: advancing_count + declining_count + unchanged_count <= active_symbol_count
      - row_condition:
          name: breadth_above_within_eligible
          arguments:
            condition: above_ma50_count <= ma50_eligible_count and above_ma200_count <= ma200_eligible_count
      - row_condition:
          name: breadth_turnover_sides_within_total
          arguments:
            condition: advancing_turnover_vnd + declining_turnover_vnd <= coalesce(turnover_vnd, 0)

  - name: fct_market_flow_daily
    description: Foreign and proprietary flow per exchange and session; the split only where valid.
    data_tests:
      - unique_combination:
          arguments:
            columns: [exchange, trade_date]
      - not_empty

  - name: fct_universe_summary_daily
    description: Point-in-time universe size, tiers, entries and exits per exchange and session.
    data_tests:
      - unique_combination:
          arguments:
            columns: [exchange, trade_date]
      - not_empty

  - name: dim_symbol
    description: One row per symbol - current exchange and ICB industry / supersector (VI, EN); classification is today's.
    columns:
      - name: symbol
        data_tests: [unique, not_null]
      - name: supersector_vi
        data_tests: [not_null]

  - name: dim_trading_period
    description: Weeks, months and years with their session count and whether they are complete.
    data_tests:
      - unique_combination:
          arguments:
            columns: [period_type, period_id]
    columns:
      - name: session_count
        data_tests: [not_null]
      - name: is_period_complete
        data_tests: [not_null]

  - name: fct_sector_daily
    description: >
      Supersector (ICB level 2) per session over in-scope, non-stale rows, both exchanges;
      counts and sums for the report's ratios, the median 1D return and an equal-weight
      index. Classification is today's, not point in time.
    data_tests:
      - unique_combination:
          arguments:
            columns: [supersector_code, trade_date]
      - not_empty
      - row_condition:
          name: sector_parts_within_active
          arguments:
            condition: advancing_count + declining_count <= active_symbol_count
      - row_condition:
          name: sector_above_within_eligible
          arguments:
            condition: above_ma50_count <= ma50_eligible_count and above_ma200_count <= ma200_eligible_count


  - name: fct_foreign_streak_daily
    description: BI v3 - per symbol and session with foreign net, the current same-sign run's length and net sum.
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol, trade_date]
      - not_empty
      - row_condition:
          name: streak_sum_has_the_run_sign
          arguments:
            condition: sign(run_net_vnd) = net_sign and run_sessions >= 1

  - name: fct_market_concentration_daily
    description: BI v3 - the fewest symbols making half / 80 % of each session's turnover (both exchanges).
    data_tests:
      - unique_combination:
          arguments:
            columns: [trade_date]
      - not_empty
      - row_condition:
          name: concentration_counts_ordered
          arguments:
            condition: 1 <= symbols_for_half_turnover and symbols_for_half_turnover <= symbols_for_80pct_turnover and symbols_for_80pct_turnover <= traded_symbol_count

  - name: fct_universe_tenure_daily
    description: BI v3 - for each universe row, the sessions in a row the symbol has been in the universe.
    data_tests:
      - unique_combination:
          arguments:
            columns: [symbol, trade_date]
      - not_empty

unit_tests:
  - name: indicators_moving_averages_and_52_week_flags
    description: >
      Windows shrunk to 2 / 3 / 4 sessions and a 3-session high / low so the answers fit in six
      rows; closes chosen so every mean is exact. The stale row (session 3) gets nothing and
      is skipped by every window: session 4's 2-session mean is (200 + 300) / 2, not
      (200 + 200) / 2. Warm-up is NULL, never a partial mean.
    model: int_prices__indicators
    overrides:
      vars: {ma_short_rows: 2, ma_medium_rows: 3, ma_long_rows: 4, high_low_rows: 3}
    given:
      - input: ref('fct_price_daily')
        rows:
          - {symbol: A, trade_date: 2026-07-01, session_seq: 1, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100}
          - {symbol: A, trade_date: 2026-07-02, session_seq: 2, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 200}
          - {symbol: A, trade_date: 2026-07-03, session_seq: 3, exchange: HOSE, is_in_scope: true, is_stale: true, close_vnd: 200}
          - {symbol: A, trade_date: 2026-07-06, session_seq: 4, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 300}
          - {symbol: A, trade_date: 2026-07-07, session_seq: 5, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 400}
          - {symbol: A, trade_date: 2026-07-08, session_seq: 6, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 200}
    expect:
      rows:
        - {symbol: A, trade_date: 2026-07-01, ma20_vnd: null, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
        - {symbol: A, trade_date: 2026-07-02, ma20_vnd: 150, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
        - {symbol: A, trade_date: 2026-07-03, ma20_vnd: null, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
        - {symbol: A, trade_date: 2026-07-06, ma20_vnd: 250, ma50_vnd: 200, ma200_vnd: null, is_new_high_52w: true, is_new_low_52w: false}
        - {symbol: A, trade_date: 2026-07-07, ma20_vnd: 350, ma50_vnd: 300, ma200_vnd: 250, is_new_high_52w: true, is_new_low_52w: false}
        - {symbol: A, trade_date: 2026-07-08, ma20_vnd: 300, ma50_vnd: 300, ma200_vnd: 275, is_new_high_52w: false, is_new_low_52w: true}

  - name: indicators_return_against_previous_close
    description: >
      The reference is the previous session's close, stale or not (a stale row repeats the
      last traded close). A stale row has no return; the first row has none.
    model: int_prices__indicators
    given:
      - input: ref('fct_price_daily')
        rows:
          - {symbol: A, trade_date: 2026-07-01, session_seq: 1, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100}
          - {symbol: A, trade_date: 2026-07-02, session_seq: 2, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 200}
          - {symbol: A, trade_date: 2026-07-03, session_seq: 3, exchange: HOSE, is_in_scope: true, is_stale: true, close_vnd: 200}
          - {symbol: A, trade_date: 2026-07-06, session_seq: 4, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100}
          - {symbol: A, trade_date: 2026-07-07, session_seq: 5, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100}
    expect:
      rows:
        - {symbol: A, trade_date: 2026-07-01, reference_vnd: null, return_1d_ratio: null}
        - {symbol: A, trade_date: 2026-07-02, reference_vnd: 100, return_1d_ratio: 1.0}
        - {symbol: A, trade_date: 2026-07-03, reference_vnd: 200, return_1d_ratio: null}
        - {symbol: A, trade_date: 2026-07-06, reference_vnd: 200, return_1d_ratio: -0.5}
        - {symbol: A, trade_date: 2026-07-07, reference_vnd: 100, return_1d_ratio: 0.0}

  - name: breadth_counts_active_rows_only
    description: >
      Session 1: A up and above its MA50, B down, below MA50, above MA200, C unchanged with no
      MA yet; D stale and E out of scope count nowhere, not in turnover either. Top-2
      turnover = A + B. Session 2: A up again, so the A/D line goes 0 → 1.
    model: fct_market_breadth_daily
    overrides:
      vars: {top_turnover_symbols: 2}
    given:
      - input: ref('int_prices__indicators')
        rows:
          - {symbol: A, trade_date: 2026-07-01, session_seq: 1, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 200, return_1d_ratio: 0.5, ma50_vnd: 100, ma200_vnd: null, is_new_high_52w: true, is_new_low_52w: false}
          - {symbol: B, trade_date: 2026-07-01, session_seq: 1, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100, return_1d_ratio: -0.5, ma50_vnd: 300, ma200_vnd: 50, is_new_high_52w: false, is_new_low_52w: true}
          - {symbol: C, trade_date: 2026-07-01, session_seq: 1, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100, return_1d_ratio: 0.0, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
          - {symbol: D, trade_date: 2026-07-01, session_seq: 1, exchange: HOSE, is_in_scope: true, is_stale: true, close_vnd: 100, return_1d_ratio: null, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
          - {symbol: E, trade_date: 2026-07-01, session_seq: 1, exchange: HOSE, is_in_scope: false, is_stale: false, close_vnd: 100, return_1d_ratio: 0.5, ma50_vnd: 50, ma200_vnd: 50, is_new_high_52w: true, is_new_low_52w: false}
          - {symbol: A, trade_date: 2026-07-02, session_seq: 2, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 300, return_1d_ratio: 0.5, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
      - input: ref('fct_price_daily')
        rows:
          - {symbol: A, trade_date: 2026-07-01, exchange: HOSE, is_in_scope: true, is_stale: false, turnover_vnd: 500}
          - {symbol: B, trade_date: 2026-07-01, exchange: HOSE, is_in_scope: true, is_stale: false, turnover_vnd: 300}
          - {symbol: C, trade_date: 2026-07-01, exchange: HOSE, is_in_scope: true, is_stale: false, turnover_vnd: 100}
          - {symbol: D, trade_date: 2026-07-01, exchange: HOSE, is_in_scope: true, is_stale: true, turnover_vnd: 1000}
          - {symbol: E, trade_date: 2026-07-01, exchange: HOSE, is_in_scope: false, is_stale: false, turnover_vnd: 2000}
          - {symbol: A, trade_date: 2026-07-02, exchange: HOSE, is_in_scope: true, is_stale: false, turnover_vnd: 10}
    expect:
      rows:
        - {exchange: HOSE, trade_date: 2026-07-01, active_symbol_count: 3, advancing_count: 1, declining_count: 1, unchanged_count: 1, ma50_eligible_count: 2, above_ma50_count: 1, ma200_eligible_count: 1, above_ma200_count: 1, high_low_eligible_count: 2, new_high_52w_count: 1, new_low_52w_count: 1, ad_line: 0, turnover_vnd: 900, top10_turnover_vnd: 800}
        - {exchange: HOSE, trade_date: 2026-07-02, active_symbol_count: 1, advancing_count: 1, declining_count: 0, unchanged_count: 0, ma50_eligible_count: 0, above_ma50_count: 0, ma200_eligible_count: 0, above_ma200_count: 0, high_low_eligible_count: 0, new_high_52w_count: 0, new_low_52w_count: 0, ad_line: 1, turnover_vnd: 10, top10_turnover_vnd: 10}

  - name: universe_summary_point_in_time
    description: >
      X is in on sessions 1-2 and out on 3; Y joins on 2. Each session counts the flag it had
      then: an "ever in the universe" count would give 2 on session 1.
    model: fct_universe_summary_daily
    given:
      - input: ref('fct_universe_daily')
        rows:
          - {symbol: X, exchange: HOSE, trade_date: 2026-07-01, session_seq: 1, liquidity_tier: HIGH, is_in_universe: true}
          - {symbol: X, exchange: HOSE, trade_date: 2026-07-02, session_seq: 2, liquidity_tier: HIGH, is_in_universe: true}
          - {symbol: X, exchange: HOSE, trade_date: 2026-07-03, session_seq: 3, liquidity_tier: null, is_in_universe: false}
          - {symbol: Y, exchange: HOSE, trade_date: 2026-07-01, session_seq: 1, liquidity_tier: null, is_in_universe: false}
          - {symbol: Y, exchange: HOSE, trade_date: 2026-07-02, session_seq: 2, liquidity_tier: LOW, is_in_universe: true}
          - {symbol: Y, exchange: HOSE, trade_date: 2026-07-03, session_seq: 3, liquidity_tier: LOW, is_in_universe: true}
    expect:
      rows:
        - {exchange: HOSE, trade_date: 2026-07-01, universe_count: 1, tier_high_count: 1, tier_low_count: 0, entered_count: 1, exited_count: 0}
        - {exchange: HOSE, trade_date: 2026-07-02, universe_count: 2, tier_high_count: 1, tier_low_count: 1, entered_count: 1, exited_count: 0}
        - {exchange: HOSE, trade_date: 2026-07-03, universe_count: 1, tier_high_count: 0, tier_low_count: 1, entered_count: 0, exited_count: 1}

  - name: trading_periods_complete_only_when_ended
    description: >
      Observed sessions to Tuesday 2026-06-30, rule-based days after it: June is complete,
      July and the week and year spanning both are not.
    model: dim_trading_period
    given:
      - input: ref('dim_trading_calendar')
        rows:
          - {calendar_date: 2026-06-29, is_trading_day: true, calendar_source: observed, trading_week_id: 202627, trading_month_id: 202606, trading_year_id: 2026}
          - {calendar_date: 2026-06-30, is_trading_day: true, calendar_source: observed, trading_week_id: 202627, trading_month_id: 202606, trading_year_id: 2026}
          - {calendar_date: 2026-07-01, is_trading_day: true, calendar_source: rule, trading_week_id: 202627, trading_month_id: 202607, trading_year_id: 2026}
          - {calendar_date: 2026-07-04, is_trading_day: false, calendar_source: rule, trading_week_id: 202627, trading_month_id: 202607, trading_year_id: 2026}
    expect:
      rows:
        - {period_type: week, period_id: 202627, session_count: 3, is_period_complete: false}
        - {period_type: month, period_id: 202606, session_count: 2, is_period_complete: true}
        - {period_type: month, period_id: 202607, session_count: 1, is_period_complete: false}
        - {period_type: year, period_id: 2026, session_count: 3, is_period_complete: false}

  - name: symbol_industry_one_row_and_unclassified
    description: >
      AAA is classified at both levels and keeps only its open exchange period (the closed
      HNX one never makes a second row); BBB has no classification and reads Unclassified.
    model: dim_symbol
    given:
      - input: ref('dim_security')
        rows:
          - {symbol: AAA, exchange: HOSE, is_in_scope: true, is_delisted: false, effective_to: null}
          - {symbol: BBB, exchange: HNX, is_in_scope: true, is_delisted: false, effective_to: null}
          - {symbol: AAA, exchange: HNX, is_in_scope: true, is_delisted: false, effective_to: 2020-01-01}
      - input: ref('stg_vnstock__symbol_industries')
        format: sql
        rows: |
          select 'AAA' as symbol, 1 as icb_level, '1000' as icb_code
          union all select 'AAA', 2, '1300'
      - input: ref('stg_vnstock__industries_icb')
        rows:
          - {icb_code: '1000', icb_level: 1, icb_name_vi: Nguyên vật liệu, icb_name_en: Basic Materials}
          - {icb_code: '1300', icb_level: 2, icb_name_vi: Hóa chất, icb_name_en: Chemicals}
    expect:
      rows:
        - {symbol: AAA, exchange: HOSE, industry_en: Basic Materials, supersector_vi: Hóa chất, supersector_en: Chemicals}
        - {symbol: BBB, exchange: HNX, industry_en: Unclassified, supersector_vi: Chưa phân ngành, supersector_en: Unclassified}

  - name: sector_counts_median_and_index
    description: >
      A and B are banks, C has no classification, D is stale. Session 1: banks 0.5 and
      -0.25 give mean and median 0.125 and turnover x return 100 x 0.5 + 300 x -0.25 = -25;
      C lands in 'none'; D is not counted. Session 2: banks 0.5 and 0 (one unchanged).
    model: fct_sector_daily
    given:
      - input: ref('fct_symbol_session_daily')
        rows:
          - {symbol: A, trade_date: 2026-07-01, session_seq: 1, is_in_scope: true, is_stale: false, return_1d_ratio: 0.5, close_vnd: 200, ma50_vnd: 100, ma200_vnd: null, is_new_high_52w: true, is_new_low_52w: false, turnover_vnd: 100, foreign_net_total_value_vnd: 10}
          - {symbol: B, trade_date: 2026-07-01, session_seq: 1, is_in_scope: true, is_stale: false, return_1d_ratio: -0.25, close_vnd: 100, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: false, is_new_low_52w: false, turnover_vnd: 300, foreign_net_total_value_vnd: -4}
          - {symbol: C, trade_date: 2026-07-01, session_seq: 1, is_in_scope: true, is_stale: false, return_1d_ratio: 0.5, close_vnd: 100, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null, turnover_vnd: 50, foreign_net_total_value_vnd: null}
          - {symbol: D, trade_date: 2026-07-01, session_seq: 1, is_in_scope: true, is_stale: true, return_1d_ratio: 0.0, close_vnd: 100, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null, turnover_vnd: 0, foreign_net_total_value_vnd: null}
          - {symbol: A, trade_date: 2026-07-02, session_seq: 2, is_in_scope: true, is_stale: false, return_1d_ratio: 0.5, close_vnd: 300, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: true, is_new_low_52w: false, turnover_vnd: 100, foreign_net_total_value_vnd: 0}
          - {symbol: B, trade_date: 2026-07-02, session_seq: 2, is_in_scope: true, is_stale: false, return_1d_ratio: 0.0, close_vnd: 100, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: false, is_new_low_52w: false, turnover_vnd: 100, foreign_net_total_value_vnd: 0}
      - input: ref('dim_symbol')
        rows:
          - {symbol: A, supersector_code: '8300', supersector_vi: Ngân hàng, supersector_en: Banks}
          - {symbol: B, supersector_code: '8300', supersector_vi: Ngân hàng, supersector_en: Banks}
          - {symbol: D, supersector_code: '8300', supersector_vi: Ngân hàng, supersector_en: Banks}
    expect:
      rows:
        - {supersector_code: '8300', trade_date: 2026-07-01, active_symbol_count: 2, advancing_count: 1, declining_count: 1, mean_return_1d_ratio: 0.125, median_return_1d_ratio: 0.125, turnover_vnd: 400, turnover_x_return_vnd: -25, ma50_eligible_count: 1, above_ma50_count: 1, new_high_52w_count: 1, foreign_net_value_vnd: 6}
        - {supersector_code: none, trade_date: 2026-07-01, active_symbol_count: 1, advancing_count: 1, declining_count: 0, mean_return_1d_ratio: 0.5, median_return_1d_ratio: 0.5, turnover_vnd: 50, turnover_x_return_vnd: 25, ma50_eligible_count: 0, above_ma50_count: 0, new_high_52w_count: 0, foreign_net_value_vnd: null}
        - {supersector_code: '8300', trade_date: 2026-07-02, active_symbol_count: 2, advancing_count: 1, declining_count: 0, mean_return_1d_ratio: 0.25, median_return_1d_ratio: 0.25, turnover_vnd: 200, turnover_x_return_vnd: 50, ma50_eligible_count: 0, above_ma50_count: 0, new_high_52w_count: 1, foreign_net_value_vnd: 0}

  - name: breadth_turnover_sides_and_oscillator
    description: >
      One symbol, ten sessions: up five times, then down five. Net advances are +1 then -1,
      so the 10-session mean is NULL for sessions 1-9 (fewer than ten rows) and 0 at 10; the
      50-session mean stays NULL. Each session's turnover (10 x session) lands on the
      advancing side while up and on the declining side while down.
    model: fct_market_breadth_daily
    given:
      - input: ref('int_prices__indicators')
        rows:
          - {symbol: A, trade_date: 2026-07-01, session_seq: 1, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100, return_1d_ratio: 0.5, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
          - {symbol: A, trade_date: 2026-07-02, session_seq: 2, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100, return_1d_ratio: 0.5, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
          - {symbol: A, trade_date: 2026-07-03, session_seq: 3, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100, return_1d_ratio: 0.5, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
          - {symbol: A, trade_date: 2026-07-06, session_seq: 4, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100, return_1d_ratio: 0.5, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
          - {symbol: A, trade_date: 2026-07-07, session_seq: 5, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100, return_1d_ratio: 0.5, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
          - {symbol: A, trade_date: 2026-07-08, session_seq: 6, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100, return_1d_ratio: -0.25, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
          - {symbol: A, trade_date: 2026-07-09, session_seq: 7, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100, return_1d_ratio: -0.25, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
          - {symbol: A, trade_date: 2026-07-10, session_seq: 8, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100, return_1d_ratio: -0.25, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
          - {symbol: A, trade_date: 2026-07-13, session_seq: 9, exchange: HOSE, is_in_scope: true, is_stale: false, close_vnd: 100, return_1d_ratio: -0.25, ma50_vnd: null, ma200_vnd: null, is_new_high_52w: null, is_new_low_52w: null}
