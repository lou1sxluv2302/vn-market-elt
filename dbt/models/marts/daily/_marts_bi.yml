  - name: foreign_streak_runs
    description: >
      A nets +5, +3, -2, 0, -1: runs of 2, 1, 1, 1 (a zero starts its own run); the run sum
      carries on inside a run only. B has no value and gives no row.
    model: fct_foreign_streak_daily
    given:
      - input: ref('fct_foreign_flow_daily')
        rows:
          - {symbol: A, trade_date: 2026-07-01, foreign_net_total_value_vnd: 5}
          - {symbol: A, trade_date: 2026-07-02, foreign_net_total_value_vnd: 3}
          - {symbol: A, trade_date: 2026-07-03, foreign_net_total_value_vnd: -2}
          - {symbol: A, trade_date: 2026-07-06, foreign_net_total_value_vnd: 0}
          - {symbol: A, trade_date: 2026-07-07, foreign_net_total_value_vnd: -1}
          - {symbol: B, trade_date: 2026-07-01, foreign_net_total_value_vnd: null}
    expect:
      rows:
        - {symbol: A, trade_date: 2026-07-01, run_sessions: 1, run_net_vnd: 5}
        - {symbol: A, trade_date: 2026-07-02, run_sessions: 2, run_net_vnd: 8}
        - {symbol: A, trade_date: 2026-07-03, run_sessions: 1, run_net_vnd: -2}
        - {symbol: A, trade_date: 2026-07-06, run_sessions: 1, run_net_vnd: 0}
        - {symbol: A, trade_date: 2026-07-07, run_sessions: 1, run_net_vnd: -1}

  - name: concentration_half_and_80pct
    description: >
      Turnover 50, 30, 20 (total 100): the first symbol reaches half, the first two reach
      80 %. A stale row and a row with no turnover are not counted.
    model: fct_market_concentration_daily
    given:
      - input: ref('fct_price_daily')
        rows:
          - {symbol: A, trade_date: 2026-07-01, is_in_scope: true, is_stale: false, turnover_vnd: 50}
          - {symbol: B, trade_date: 2026-07-01, is_in_scope: true, is_stale: false, turnover_vnd: 30}
          - {symbol: C, trade_date: 2026-07-01, is_in_scope: true, is_stale: false, turnover_vnd: 20}
          - {symbol: D, trade_date: 2026-07-01, is_in_scope: true, is_stale: true, turnover_vnd: 900}
          - {symbol: E, trade_date: 2026-07-01, is_in_scope: true, is_stale: false, turnover_vnd: 0}
    expect:
      rows:
        - {trade_date: 2026-07-01, traded_symbol_count: 3, turnover_vnd: 100, symbols_for_half_turnover: 1, symbols_for_80pct_turnover: 2}

  - name: universe_tenure_runs
    description: >
      A is in, in, out, in: tenure 1, 2, then 1 again after the gap. B is never in: no row.
    model: fct_universe_tenure_daily
    given:
      - input: ref('fct_universe_daily')
        rows:
          - {symbol: A, trade_date: 2026-07-01, is_in_universe: true}
          - {symbol: A, trade_date: 2026-07-02, is_in_universe: true}
          - {symbol: A, trade_date: 2026-07-03, is_in_universe: false}
          - {symbol: A, trade_date: 2026-07-06, is_in_universe: true}
          - {symbol: B, trade_date: 2026-07-01, is_in_universe: false}
    expect:
      rows:
        - {symbol: A, trade_date: 2026-07-01, tenure_sessions: 1}
        - {symbol: A, trade_date: 2026-07-02, tenure_sessions: 2}
        - {symbol: A, trade_date: 2026-07-06, tenure_sessions: 1}
