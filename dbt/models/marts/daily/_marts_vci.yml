version: 2

# Vietcap REST data (research plan R6-C, R6-I): corporate actions and the index ledger.

models:
  - name: fct_corporate_action
    description: >
      One row per dividend or share issue (newest snapshot), typed from the event code and
      title. Adjusted prices already contain these events; the table is the independent
      record of them.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
    data_tests:
      - not_empty
      - row_condition:
          name: corporate_action_ratio_not_negative
          arguments:
            condition: exercise_ratio is null or exercise_ratio >= 0

  - name: fct_index_membership_daily
    description: >
      The VN30 / HNX30 ledger with an inclusion flag against the group's previous recorded
      date. Starts 2026-10-21; there is no earlier history in any source in the stack.
    data_tests:
      - unique_combination:
          arguments:
            columns: [as_of_date, group_code, symbol]
      - not_empty

  - name: fct_price_rescale_check
    description: >
      Each vendor rescale of a HOSE / HNX symbol against the corporate actions in its window:
      expected ratio, gap and status (matched, ratio_differs, rights_involved, no_event). Only
      ex-date shapes (`is_ex_date_shape`: pulled within `rescale_event_window_days` of the last
      changed session) are judged. The first independent check of the vendor's adjustment.
    data_tests:
      - unique_combination:
          arguments:
            columns: [_source_id, symbol, _ingested_at, _source_file]
      - row_condition:
          name: monitor_rescale_explained_by_a_corporate_action
          config:
            severity: warn
          arguments:
            condition: not is_ex_date_shape or status in ('matched', 'rights_involved')

unit_tests:
  - name: rescale_expected_ratio_from_events
    description: >
      A: a cash dividend of 1,000 on a close of 20,000 expects 0.95, the vendor's 0.951 is
      within tolerance. B: a bonus issue of 25 % and a cash dividend of 5 % of par (500 VND on
      25,000) on one date expect 0.8 x 0.98 = 0.784; 0.76 differs. C: a rights issue is not
      judged. D: nothing in the window. E: the event lies after the pull, so it is not used.
    model: fct_price_rescale_check
    given:
      - input: ref('fct_price_revision')
        rows:
          - {_source_id: q, symbol: A, _ingested_at: "2026-09-10 09:00:00", _source_file: f, ingest_partition: 2026-09-10, last_changed_date: 2026-09-08, reference_ratio: 0.951, revision_class: rescale}
          - {_source_id: q, symbol: B, _ingested_at: "2026-09-10 09:00:00", _source_file: f, ingest_partition: 2026-09-10, last_changed_date: 2026-09-08, reference_ratio: 0.76, revision_class: rescale}
          - {_source_id: q, symbol: C, _ingested_at: "2026-09-10 09:00:00", _source_file: f, ingest_partition: 2026-09-10, last_changed_date: 2026-09-08, reference_ratio: 0.9, revision_class: rescale}
          - {_source_id: q, symbol: D, _ingested_at: "2026-09-10 09:00:00", _source_file: f, ingest_partition: 2026-09-10, last_changed_date: 2026-09-08, reference_ratio: 0.9, revision_class: rescale}
          - {_source_id: q, symbol: E, _ingested_at: "2026-09-10 09:00:00", _source_file: f, ingest_partition: 2026-09-10, last_changed_date: 2026-09-08, reference_ratio: 0.9, revision_class: rescale}
      - input: ref('fct_price_daily')
        rows:
          - {symbol: A, trade_date: 2026-09-08, exchange: HOSE}
          - {symbol: B, trade_date: 2026-09-08, exchange: HNX}
          - {symbol: C, trade_date: 2026-09-08, exchange: HOSE}
          - {symbol: D, trade_date: 2026-09-08, exchange: HOSE}
          - {symbol: E, trade_date: 2026-09-08, exchange: HOSE}
      - input: ref('int_prices__revisions')
        rows:
          - {_source_id: q, symbol: A, _ingested_at: "2026-09-10 09:00:00", _source_file: f, trade_date: 2026-09-08, old_close_vnd: 20000}
          - {_source_id: q, symbol: B, _ingested_at: "2026-09-10 09:00:00", _source_file: f, trade_date: 2026-09-08, old_close_vnd: 25000}
          - {_source_id: q, symbol: C, _ingested_at: "2026-09-10 09:00:00", _source_file: f, trade_date: 2026-09-08, old_close_vnd: 10000}
          - {_source_id: q, symbol: D, _ingested_at: "2026-09-10 09:00:00", _source_file: f, trade_date: 2026-09-08, old_close_vnd: 10000}
          - {_source_id: q, symbol: E, _ingested_at: "2026-09-10 09:00:00", _source_file: f, trade_date: 2026-09-08, old_close_vnd: 10000}
      - input: ref('fct_corporate_action')
        rows:
          - {event_id: "1", symbol: A, action_type: cash_dividend, ex_rights_date: 2026-09-09, exercise_ratio: 0.1, value_per_share_vnd: 1000}
          - {event_id: "2", symbol: B, action_type: bonus_issue, ex_rights_date: 2026-09-09, exercise_ratio: 0.25, value_per_share_vnd: null}
          - {event_id: "3", symbol: B, action_type: cash_dividend, ex_rights_date: 2026-09-09, exercise_ratio: 0.05, value_per_share_vnd: null}
          - {event_id: "4", symbol: C, action_type: rights_issue, ex_rights_date: 2026-09-09, exercise_ratio: 0.5, value_per_share_vnd: null}
          - {event_id: "5", symbol: E, action_type: cash_dividend, ex_rights_date: 2026-09-11, exercise_ratio: 0.1, value_per_share_vnd: 1000}
    expect:
      rows:
        - {symbol: A, adjusting_events: 1, status: matched}
        - {symbol: B, adjusting_events: 2, status: ratio_differs}
        - {symbol: C, adjusting_events: 0, status: rights_involved}
        - {symbol: D, adjusting_events: 0, status: no_event}
        - {symbol: E, adjusting_events: 0, status: no_event}

  - name: index_membership_flags_inclusions_against_the_previous_date
    description: >
      VN30 on two dates: A and B, then A and C. C is new on the second date, A is not; the
      first date has no previous one, so nothing is flagged there.
    model: fct_index_membership_daily
    given:
      - input: ref('stg_vci__index_membership')
        rows:
          - {as_of_date: 2026-10-21, group_code: VN30, symbol: A}
          - {as_of_date: 2026-10-21, group_code: VN30, symbol: B}
          - {as_of_date: 2026-10-22, group_code: VN30, symbol: A}
          - {as_of_date: 2026-10-22, group_code: VN30, symbol: C}
    expect:
      rows:
        - {as_of_date: 2026-10-21, group_code: VN30, symbol: A, is_new_member: null}
        - {as_of_date: 2026-10-21, group_code: VN30, symbol: B, is_new_member: null}
        - {as_of_date: 2026-10-22, group_code: VN30, symbol: A, is_new_member: false}
        - {as_of_date: 2026-10-22, group_code: VN30, symbol: C, is_new_member: true}

  - name: corporate_action_types_from_code_and_title
    description: >
      DIV is a cash dividend whatever the title; share issues are typed from the title, and a
      title never seen before is other_issue.
    model: fct_corporate_action
    given:
      - input: ref('stg_vci__corporate_actions')
        rows:
          - {event_id: "1", event_code: DIV, event_title_en: "Cash Dividend - Year 2025 - 450 VND"}
          - {event_id: "2", event_code: ISS, event_title_en: "Share Issue - Bonus Issue ratio 10.0%"}
          - {event_id: "3", event_code: ISS, event_title_en: "Share Issue - Stock dividend ratio 18.0%"}
          - {event_id: "4", event_code: ISS, event_title_en: "Share Issue - Rights Issue ratio 20.0%"}
          - {event_id: "5", event_code: ISS, event_title_en: "Share Issue - Private Placements ratio 6.5%"}
          - {event_id: "6", event_code: ISS, event_title_en: "Share Issue - ESOP"}
    expect:
      rows:
        - {event_id: "1", action_type: cash_dividend}
        - {event_id: "2", action_type: bonus_issue}
        - {event_id: "3", action_type: stock_dividend}
        - {event_id: "4", action_type: rights_issue}
        - {event_id: "5", action_type: private_placement}
        - {event_id: "6", action_type: other_issue}
