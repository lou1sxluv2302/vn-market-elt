version: 2

sources:
  - name: vnstock
    description: >
      v1's raw parquet history, loaded append-only by vnmarket.el.load_v1_history (P1).
      Every pull is kept; latest-wins happens in staging.
    schema: raw_vnstock
    tables:
      - name: ohlcv_daily
        description: Daily OHLCV, one row per (source, symbol, session_date, pull).
        columns:
          - name: _source_file
            data_tests: [not_null]
          - name: _ingested_at
            data_tests: [not_null]
      - name: ref_symbols_by_exchange
        description: Snapshots of the symbol list with exchange and instrument type.
      - name: ref_symbols_by_industries
        description: Snapshots of the symbol -> ICB code list, one row per symbol and level.
      - name: ref_industries_icb
        description: Snapshots of the ICB tree with Vietnamese and English names.
      - name: foreign_trade_daily
        description: >
          Snapshots of v1's daily foreign flow file (v1 rewrites it whole every day), one per
          content (`_source_sha256`); partitioned by month of session_date.
        columns:
          - name: _source_sha256
            data_tests: [not_null]
          - name: _loaded_at
            data_tests: [not_null]
      - name: prop_trade_daily
        description: Snapshots of v1's daily proprietary flow file, as foreign_trade_daily.
        columns:
          - name: _source_sha256
            data_tests: [not_null]
          - name: _loaded_at
            data_tests: [not_null]
      - name: fundamental_statement
        description: >
          Snapshots of v1's financial-statement file (VCI, long form: symbol x statement x item x
          fiscal period; 2018 onwards), one per content (`_source_sha256`); clustered by symbol.
          No publication date in the source: v1's `available_from_date` is its deadline rule.
        columns:
          - name: _source_sha256
            data_tests: [not_null]
          - name: _loaded_at
            data_tests: [not_null]
      - name: capital_history
        description: >
          Snapshots of v1's charter-capital history (one row per symbol and change date).
          Loaded for later use (raw-price and share-count work, research plan R6); no model reads
          it yet.
      - name: index_daily
        description: >
          Snapshots of v1's index table (bronze_index), read read-only from its DuckDB. One
          series spliced in v1: legacy rows without a source id to 2026-03-06, vnstock_quote
          rows from 2026-03-09 (known limitation, data-sources.md).
        columns:
          - name: _source_sha256
            data_tests: [not_null]
          - name: _loaded_at
            data_tests: [not_null]
