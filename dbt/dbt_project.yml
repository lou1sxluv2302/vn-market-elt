name: vnmarket
version: "0.1.0"
config-version: 2
profile: vnmarket

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false  # no telemetry from this project

vars:
  # Daily price sources, in order of preference (config/sources of v1: vnstock_quote is
  # primary, vndirect_dchart its fallback). staging keeps both; intermediate chooses.
  primary_price_source: vnstock_quote
  fallback_price_source: vndirect_dchart

  # Trading calendar (docs/knowledge/market-microstructure.md §8). History: a date is a
  # session when at least this many symbols traded (v1 convention, never re-measured).
  min_traded_symbols_per_session: 30
  calendar_first_date: "2005-01-01"  # as v1: earlier rows are too sparse to form sessions
  calendar_last_date: "2027-12-31"   # extend with each year's holiday seed (tested)

  # Exchange for delisted symbols whose list entry lost it, inferred from price ticks
  # (v1 load_legacy.infer_exchange): HNX ticks are a flat 100 VND, HOSE uses 10 below
  # 10,000 and 50 up to 49,950. Unreliable on adjusted prices; flagged as inferred.
  exchange_inference_min_rows: 30
  exchange_inference_hnx_share: 0.95
  # The price bands where the two exchanges' ticks differ (tick_size seed: HOSE 10 below
  # 10,000 and 50 up to 49,950; HNX a flat 100).
  inference_low_price_below_vnd: 10000
  inference_mid_price_max_vnd: 49999
  inference_hnx_tick_vnd: 100

  # Liquidity tiers from v1 (VND, ADV20 of matched turnover). PROVISIONAL and UNMEASURED:
  # kept so the universe reproduces v1; the research track measures them (ADR-0028).
  adv_window_rows: 20          # previous non-stale rows (ADR-0028)
  adv_min_rows: 15
  liquidity_tier_high_vnd: 100000000000
  liquidity_tier_medium_vnd: 30000000000
  liquidity_tier_low_vnd: 10000000000
  universe_tiers: [HIGH, MEDIUM, LOW]

  # Flows (docs/knowledge/flows.md §2.3). Match + put-through = total, per side and unit.
  # Measured on prod staging 2026-10-16 (foreign, rows v1 marked valid): 3,647,843 exact,
  # 0 off by 1-2 (rounding never shows), 4,731 off by 3 or more (4,664 by more than 1,000);
  # prop: 142,665 exact, 176 off by more than 1,000. So any gap marks the split invalid.
  flow_breakdown_tolerance: 0
  foreign_breakdown_valid_from: "2020-01-02"   # flows.md: earlier splits carried 0 for no data

  # Data-quality tests (P3, docs/knowledge/data-quality-lessons.md). The watched symbols and
  # the falling-market windows are v1's choices (dq test 18, validate_all group D), kept as
  # v1 had them and never measured in v2; the planted-fault fixture overrides them.
  dq_watched_symbols: [HPG, FPT, VCB, VNM, SSI, MBB]
  dq_watched_from: "2023-01-01"
  dq_watched_to: "2025-12-31"
  dq_watched_max_missing_sessions: 5
  dq_falling_market_windows:
    - {from: "2018-01-01", to: "2018-12-31"}
    - {from: "2020-01-01", to: "2020-03-31"}
    - {from: "2022-01-01", to: "2022-12-31"}
  dq_falling_market_symbols_more_than: 50
  # Non-stale fallback rows of symbols ever in the universe: 151 rows of 40 symbols,
  # measured on prod marts 2026-10-13 (data to 2026-10-13). v1 measured 0 under its own
  # source rule; v2's clean-row rule (ADR-0028 decision 7) puts some there by design.
  dq_fallback_rows_ceiling: 151
  # "Today" for the next-year holiday test; null means the warehouse's date.
  dq_holiday_check_date: null

models:
  vnmarket:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      daily:
        +schema: marts_daily
        +materialized: table

seeds:
  vnmarket:
    +schema: staging
    +quote_columns: false
