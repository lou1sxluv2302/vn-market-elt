name: vnmarket
version: "0.1.0"
config-version: 2
profile: vnmarket

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false  # no telemetry from this project

vars:
  # Daily price sources, in order of preference (config/sources of v1: vnstock_quote is
  # primary, vndirect_dchart its fallback). staging keeps both; intermediate chooses.
  primary_price_source: vnstock_quote
  fallback_price_source: vndirect_dchart

  # Trading calendar (docs/knowledge/market-microstructure.md §8). History: a date is a
  # session when at least this many symbols traded (v1 convention, never re-measured).
  min_traded_symbols_per_session: 30
  calendar_first_date: "2005-01-01"  # as v1: earlier rows are too sparse to form sessions
  calendar_last_date: "2027-12-31"   # extend with each year's holiday seed (tested)

  # Exchange for delisted symbols whose list entry lost it, inferred from price ticks
  # (v1 load_legacy.infer_exchange): HNX ticks are a flat 100 VND, HOSE uses 10 below
  # 10,000 and 50 up to 49,950. Unreliable on adjusted prices; flagged as inferred.
  exchange_inference_min_rows: 30
  exchange_inference_hnx_share: 0.95

  # Liquidity tiers from v1 (VND, ADV20 of matched turnover). PROVISIONAL and UNMEASURED:
  # kept so the universe reproduces v1; the research track measures them (P2 decision 2).
  adv_window_rows: 20          # previous non-stale rows (P2 decision 3)
  adv_min_rows: 15
  liquidity_tier_high_vnd: 100000000000
  liquidity_tier_medium_vnd: 30000000000
  liquidity_tier_low_vnd: 10000000000
  universe_tiers: [HIGH, MEDIUM, LOW]

models:
  vnmarket:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      daily:
        +schema: marts_daily
        +materialized: table

seeds:
  vnmarket:
    +schema: staging
    +quote_columns: false
