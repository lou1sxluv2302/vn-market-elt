# Required checks `terraform-validate` and `terraform-plan` (CONTRIBUTING.md,
# "main ruleset"). The repository is public, so job logs are public: every
# environment value (project id, WIF provider, service account, e-mail) comes
# from GitHub secrets, which Actions masks in logs, and the plan step prints
# only a count of changes, never the plan body.
name: infra

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  terraform-validate:
    name: terraform-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate both stacks (no credentials, no backend)
        run: |
          for stack in bootstrap main; do
            terraform -chdir="infra/terraform/$stack" init -backend=false -lockfile=readonly
            terraform -chdir="infra/terraform/$stack" validate
          done

  terraform-plan:
    name: terraform-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token for WIF; GitHub issues none to fork pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did infra/terraform change?
        id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # first push of a branch: no base to compare
          elif git diff --quiet "$BASE" HEAD -- infra/terraform .github/workflows/infra.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::⚪ not run: infra/terraform and this workflow are unchanged, no plan needed"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.changed.outputs.run == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.changed.outputs.run == 'true'
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Plan the main stack (read-only identity, no lock)
        if: steps.changed.outputs.run == 'true'
        working-directory: infra/terraform/main
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          STATE_BUCKET: ${{ secrets.GCP_PROJECT_ID }}-tfstate
        run: |
          # stdout and stderr both stay out of the public log: provider errors can
          # carry the project number or account names, which masking does not cover.
          if ! terraform init -lockfile=readonly -backend-config="bucket=${STATE_BUCKET}" > /dev/null 2>&1; then
            echo "::error::terraform init failed; run it locally to read the error"
            exit 1
          fi
          set +e
          terraform plan -lock=false -detailed-exitcode -out=tfplan > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::terraform plan failed; run it locally to read the error"
            exit 1
          fi
          terraform show -json tfplan | python3 -c '
          import json, sys, collections
          plan = json.load(sys.stdin)
          counts = collections.Counter(
              "+".join(c["change"]["actions"]) for c in plan.get("resource_changes", [])
          )
          counts.pop("no-op", None)
          print("Plan summary:", dict(counts) or "no changes")
          '
