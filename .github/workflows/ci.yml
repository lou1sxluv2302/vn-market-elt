# Required checks `lint` and `self-test` (CONTRIBUTING.md, "main ruleset").
# Actions are pinned to a commit SHA (spec §14.7); Dependabot bumps them.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pins agree across pyproject, hooks and workflows
        run: python tools/check_pins.py
      - name: Palette meets its measured rules (config/palette.yml)
        run: python tools/check_palette.py
      - name: Market-rule seeds agree with the knowledge file
        run: python tools/check_seeds_vs_knowledge.py
      - name: pre-commit hooks (security hooks run in the security workflow)
        env:
          SKIP: secret-scan,gitleaks,no-data-files
        run: pre-commit run --all-files --show-diff-on-failure

  self-test:
    name: self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,el]"
      - name: Every --self-test in the repository
        run: python tools/run_self_tests.py

  dbt-test:
    name: dbt-test
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # the planted-fault matrix builds the project ~30 times
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: ci # a throwaway DuckDB file: no warehouse, no credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        working-directory: .
        run: python -m pip install -e ".[dbt]"
      - name: Seeds and their tests (market rules, holidays)
        # cautious: only tests whose every parent is a seed (not seed + model tests)
        run: dbt build --target ci --select resource_type:seed --indirect-selection cautious
      - name: Empty sources and models, so unit tests can read their parents' columns
        run: |
          dbt run-operation create_ci_sources --target ci
          dbt run --empty --target ci
      - name: Unit tests (known answers for every rule)
        run: dbt test --target ci --select test_type:unit
      - name: Planted faults (every data test proven able to go red)
        working-directory: .
        run: python tools/planted_faults.py
